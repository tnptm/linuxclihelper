[project]
name = "linuxclihelper"
version = "0.1.2"
description = "Turn plain-English Linux tasks into explained, permission-gated shell commands using Ollama"
readme = "README.md"
authors = [
    { name = "Toni Patama", email = "tonipat047@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "ollama>=0.5",
    "rich>=13.9",
]

[project.scripts]
linuxclihelper = "linuxclihelper:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
